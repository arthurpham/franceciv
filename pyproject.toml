[project]
name = "franceciv"
version = "0.1.0"
description = "A Civilization-style visualizer of real French public data"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.2",
  "pyarrow>=18.0",
  "rasterio>=1.4",
  "pillow>=11.0",
  "openpyxl>=3.1.5",
  "xlrd>=2.0",
  "shapely>=2.2.0",
  "py7zr>=1.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0",
]
